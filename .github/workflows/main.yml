name: verified-delivery

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a verified release (maintainers only)'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: verified-delivery-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 2

jobs:
  quality:
    name: CMake, browser, coverage, format, and analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install checked tooling
        run: sudo apt-get update && sudo apt-get install --yes cmake ninja-build g++ clang ccache cppcheck clang-tidy shellcheck ripgrep
      - name: CMake, CTest, and coverage
        run: |
          cmake --preset core-coverage-gcc
          cmake --build --preset core-coverage-gcc
          ctest --preset core-coverage-gcc
      - name: Browser gates
        run: npm run check:web && npm run coverage:browser
      - name: Static gates
        run: |
          ./scripts/check-release-inputs.sh
          ./scripts/check-release-contract.sh
          ./scripts/run-static-analysis.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quality-evidence
          path: |
            build/core-coverage-gcc/server/CMakeFiles/conspire-core-test.dir/*.gcov
            dist/metadata/
          if-no-files-found: error
          retention-days: 14

  container-smoke:
    name: Runtime image contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [quality, supply-chain]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install container-contract tooling
        run: sudo apt-get update && sudo apt-get install --yes ripgrep
      - name: Validate Docker contract without publishing
        run: ./scripts/container-smoke.sh --verify-only

  supply-chain:
    name: Dependency and configuration scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: quality
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Scan source and Docker configuration
        uses: aquasecurity/trivy-action@1f0aa582c8c8f5f7639610d6d38baddfea4fdcee # v0.9.2
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'

  release-dry-run:
    name: Release dry run
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [quality, supply-chain, container-smoke]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Produce non-publishing release evidence
        run: ./scripts/release-dry-run.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-dry-run-evidence
          path: dist/metadata/
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish verified release
    needs: [quality, supply-chain, container-smoke, release-dry-run]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    environment: release
    env:
      OUTPUT: x86_64
      TARGET: x86_64-linux-musl
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Determine release version
        id: semantic-release
        uses: cycjimmy/semantic-release-action@b1b432f13acb7768e0c8efdec416d363a57546f2 # v4.1.1
        with:
          extra_plugins: |
            @semantic-release/changelog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install pinned musl toolchain
        if: ${{ steps.semantic-release.outputs.new_release_published == 'true' }}
        uses: dyne/musl-action@d26fe56f7fe134a54e729d781ec687e847db34d3 # main at review
        with:
          target_arch: x86_64
      - name: Build verified release binary
        if: ${{ steps.semantic-release.outputs.new_release_published == 'true' }}
        env:
          CONSPIRE_DEPS_PREFIX: ${{ vars.CONSPIRE_OATPP_1_4_PREFIX }}
        run: |
          test -n "$CONSPIRE_DEPS_PREFIX"
          make VERSION="${{ steps.semantic-release.outputs.new_release_version }}" \
            TARGET="$TARGET" CONSPIRE_DEPS_PREFIX="$CONSPIRE_DEPS_PREFIX"
      - name: Create release checksum
        if: ${{ steps.semantic-release.outputs.new_release_published == 'true' }}
        run: sha256sum "conspire-${OUTPUT}" > SHA256SUMS.txt
      - name: Upload release to files.dyne.org
        if: ${{ steps.semantic-release.outputs.new_release_published == 'true' }}
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.FILES_SSH_HOST }}
          username: ${{ secrets.FILES_SSH_USER }}
          key: ${{ secrets.FILES_SSH_KEY }}
          port: ${{ secrets.FILES_SSH_PORT }}
          source: conspire-${{ env.OUTPUT }},SHA256SUMS.txt
          target: /srv/ftp/conspire
          overwrite: true
      - name: Publish GitHub release
        if: ${{ steps.semantic-release.outputs.new_release_published == 'true' }}
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            conspire-${{ env.OUTPUT }}
            SHA256SUMS.txt
          tag_name: ${{ steps.semantic-release.outputs.new_release_version }}
          fail_on_unmatched_files: true
