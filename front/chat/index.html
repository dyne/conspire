<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Conspire Chat</title>

    <link rel="stylesheet" href="/room/%%%ROOM_ID%%%/chat.css">
</head>
<body>

    <div id="chat_container">

        <div id="chat_status">
            <p id="status_connection" class="status_online">online</p>
            <button type="button" id="participants_toggle">
                <span id="participant_count">0</span> 👥
            </button>
        </div>

        <div id="chat_main">
            <div id="chat_history_wrapper">
                <div id="chat_history"></div>
                <div id="chat_whos_typing"></div>
            </div>
            <div id="chat_participants"></div>
        </div>

        <div id="chat_input_container">
            <div id="emoji">
                <p>&#128513;</p>
                <p>&#128521;</p>
                <p>&#128528;</p>
                <p>&#128532;</p>
                <p>&#128534;</p>
                <p>&#128536;</p>
                <p>&#128175;</p>
                <p>&#128077;</p>
                <p>&#128078;</p>
                <p>&#9757;</p>
                <p>&#8986;</p>
                <p>&#9749;</p>
                <p>&#128064;</p>
                <p>&#128066;</p>
                <p>&#128068;</p>
            </div>
            <form name="publish" autocomplete="off">
                <div id="ta-container">
                    <div id="ta-div">
                        <textarea class="input-text"
                                  placeholder="Type a message"
                                  name="message"
                                  id="chat_input"
                                  maxlength="4096"></textarea>
                    </div>
                </div>
            </form>
            <div id="button_row">
                <input id="send_button" type="button" value="Send">
                <input id="file_share_button_overlay" type="button" value="Share Files">
                <input id="file_share_button" type="file" multiple>
            </div>
        </div>

        <div id="participants_overlay"></div>

    </div>

    <script type="module" src="/room/%%%ROOM_ID%%%/ui.js"></script>

</body>
</html>
